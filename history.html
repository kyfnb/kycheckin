<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>방문 이력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <a href="index.html" class="back-link">← 메뉴</a>
    <div class="who">담당자: <strong id="sv-name-label"></strong></div>
  </div>

  <div class="content">
    <p class="page-title">방문 이력</p>

    <div class="btn-row" style="margin-bottom:16px;">
      <button class="btn btn-secondary" id="view-list-btn" onclick="setView('list')">목 록</button>
      <button class="btn btn-secondary" id="view-calendar-btn" onclick="setView('calendar')">방문<br/>캘린더</button>
      <button class="btn btn-secondary" id="view-unvisited-btn" onclick="setView('unvisited')">미방문<br/>매장</button>
    </div>

    <!-- ===== 1) 목록 뷰 ===== -->
    <div id="list-view">
      <div class="card">
        <div class="field" style="margin-bottom:12px;">
          <label>조회 기간</label>
          <div class="btn-row">
            <button class="btn btn-secondary period-btn" data-period="1m" onclick="setPeriod('1m')">최근 1개월</button>
            <button class="btn btn-secondary period-btn" data-period="3m" onclick="setPeriod('3m')">최근 3개월</button>
            <button class="btn btn-secondary period-btn" data-period="custom" onclick="setPeriod('custom')">직접입력</button>
          </div>
        </div>
        <div class="field" id="custom-date-range" style="display:none; margin-bottom:0;">
          <div class="btn-row">
            <input type="date" id="date-start" onchange="applyCustomRange()" />
            <input type="date" id="date-end" onchange="applyCustomRange()" />
          </div>
          <p class="hint">시작일과 종료일을 모두 선택하면 자동으로 조회돼요.</p>
        </div>
      </div>

      <div class="btn-row" style="margin-bottom:16px;" id="filter-row">
        <button class="btn btn-secondary" id="filter-mine" onclick="setFilter('mine')">담당매장</button>
        <button class="btn btn-secondary" id="filter-all" onclick="setFilter('all')">전체 보기</button>
      </div>

      <div class="card" id="visit-list-card">
        <div id="visit-list"></div>
        <div class="empty-state" id="empty-state" style="display:none;">
          <div class="big-icon">🗂</div>
          <div>이 기간에는 방문 기록이 없습니다.</div>
        </div>
      </div>
    </div>

    <!-- ===== 2) 캘린더 뷰 ===== -->
    <div id="calendar-view" style="display:none;">
      <div class="card">
        <div class="btn-row" style="margin-bottom:14px; align-items:center;">
          <button class="btn btn-ghost" style="flex:0 0 auto; width:auto; padding:8px 14px;" onclick="changeCalendarMonth(-1)">◀</button>
          <div style="flex:1; text-align:center; font-weight:700; font-size:16px;" id="calendar-month-label"></div>
          <button class="btn btn-ghost" style="flex:0 0 auto; width:auto; padding:8px 14px;" onclick="changeCalendarMonth(1)">▶</button>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </div>

      <div class="card" id="calendar-day-detail" style="display:none;">
        <div id="calendar-day-title" style="font-weight:700; margin-bottom:10px;"></div>
        <div id="calendar-day-list"></div>
      </div>
    </div>

    <!-- ===== 3) 미방문 매장 뷰 ===== -->
    <div id="unvisited-view" style="display:none;">
      <p class="page-sub">최근 60일간 방문하지 않은 담당 매장이에요.</p>

      <div class="card" id="unvisited-stats" style="display:none;">
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-value" id="stat-total">-</div>
            <div class="stat-label">담당 매장</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="stat-visited">-</div>
            <div class="stat-label">방문</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="stat-unvisited">-</div>
            <div class="stat-label">미방문</div>
          </div>
        </div>
      </div>

      <div class="card" id="unvisited-card">
        <div id="unvisited-list"></div>
        <div class="empty-state" id="unvisited-empty" style="display:none;">
          <div class="big-icon">🎉</div>
          <div>담당하신 매장 모두 최근에 방문하셨네요!</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="js/sheets-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/history.js"></script>

</body>
</html>
