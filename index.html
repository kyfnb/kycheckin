<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>가맹점 방문 확인</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#146B5C" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <div>
      <div class="eyebrow">FRANCHISE VISIT LOG</div>
      <h1 style="font-size:17px;">가맹점 방문 확인</h1>
    </div>
  </div>

  <div class="content">

    <!-- 1. 로그인 전: 이름/이메일로 접근 요청 -->
    <div id="login-view">
      <p class="page-title">담당자 로그인</p>
      <p class="page-sub">이름과 회사 이메일을 입력하세요. 처음 요청하면 관리자 승인이 필요해요.</p>

      <div class="card">
        <div class="field">
          <label for="sv-name">이름</label>
          <input type="text" id="sv-name" placeholder="예: 김수퍼" />
        </div>
        <div class="field">
          <label for="sv-email">회사 이메일</label>
          <input type="email" id="sv-email" placeholder="예: hong@company.com" />
        </div>
        <button class="btn btn-primary" onclick="handleRequestAccess()">접속 요청하기</button>
        <p class="hint" id="login-error" style="margin-top:10px; color:var(--danger);"></p>
      </div>
    </div>

    <!-- 2. 승인 대기 화면 -->
    <div id="pending-view" style="display:none;">
      <p class="page-title">승인 대기 중</p>
      <div class="card" style="text-align:center; padding:32px 20px;">
        <div style="font-size:36px; margin-bottom:12px;">⏳</div>
        <div style="font-weight:600; font-size:15px; margin-bottom:6px;" id="pending-email"></div>
        <p class="hint">관리자가 접속을 승인하면 사용할 수 있어요.<br/>승인 후 다시 로그인해주세요.</p>
      </div>
      <button class="btn btn-ghost" onclick="logoutSV()">다른 정보로 다시 시도</button>
    </div>

    <!-- 3. 로그인 후 메인 메뉴 -->
    <div id="main-view" style="display:none;">
      <p class="page-title">안녕하세요, <span id="welcome-name"></span>님</p>
      <p class="page-sub">오늘 방문할 가맹점의 QR코드를 스캔하세요.</p>

      <a href="scan.html" style="text-decoration:none;">
        <div class="card" style="text-align:center; padding:32px 20px;">
          <div style="font-size:40px; margin-bottom:8px;">📷</div>
          <div style="font-weight:600; font-size:16px; margin-bottom:4px;">QR 스캔하고 방문 등록</div>
          <div class="hint">카메라와 위치 권한이 필요해요</div>
        </div>
      </a>

      <div class="btn-row" style="margin-top:8px;">
        <a href="history.html" style="text-decoration:none; flex:1;">
          <button class="btn btn-secondary">방문 이력</button>
        </a>
        <a href="store-lookup.html" style="text-decoration:none; flex:1;">
          <button class="btn btn-secondary">가맹점 QR 링크 찾기</button>
        </a>
      </div>

      <button class="btn btn-ghost" style="margin-top:24px;" onclick="logoutSV()">로그아웃</button>
    </div>

  </div>
</div>

<script src="js/sheets-config.js"></script>
<script src="js/utils.js"></script>
<script>
  function showView(view) {
    document.getElementById("login-view").style.display = view === "login" ? "block" : "none";
    document.getElementById("pending-view").style.display = view === "pending" ? "block" : "none";
    document.getElementById("main-view").style.display = view === "main" ? "block" : "none";
  }

  function renderInitialView() {
    const sv = getCurrentSV();
    if (sv) {
      showView("main");
      document.getElementById("welcome-name").textContent = sv.name;
    } else {
      showView("login");
    }
  }

  async function handleRequestAccess() {
    const name = document.getElementById("sv-name").value.trim();
    const email = document.getElementById("sv-email").value.trim();
    const errorEl = document.getElementById("login-error");
    errorEl.textContent = "";

    if (!name || !email) {
      errorEl.textContent = "이름과 이메일을 모두 입력해주세요.";
      return;
    }
    if (!email.includes("@")) {
      errorEl.textContent = "올바른 이메일 형식이 아니에요.";
      return;
    }

    try {
      const result = await apiPost({ action: "requestAccess", name, email });

      if (result.approved) {
        setCurrentSV({ name: result.name, email: result.email });
        renderInitialView();
        return;
      }

      if (result.pending) {
        document.getElementById("pending-email").textContent = email;
        showView("pending");
        return;
      }

      errorEl.textContent = result.error || "요청이 거부되었습니다. 관리자에게 문의해주세요.";
    } catch (e) {
      console.error(e);
      errorEl.textContent = "요청 중 오류가 발생했습니다. 네트워크 또는 설정을 확인해주세요.";
    }
  }

  renderInitialView();

  // PWA 서비스워커 등록
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  }
</script>

</body>
</html>
