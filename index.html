<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>가맹점 방문 확인</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="theme-color" content="#101010" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  #app-splash {
    position: fixed;
    inset: 0;
    background: #101010;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.45s ease;
  }
  #app-splash img {
    width: 55vw;
    max-width: 220px;
    animation: splash-pulse 1.6s ease-in-out infinite;
  }
  @keyframes splash-pulse {
    0%, 100% { opacity: 0.65; }
    50% { opacity: 1; }
  }
  #app-splash.hide {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="app-splash">
  <img src="assets/logo-white.png" alt="KIYOUNG F&B" />
</div>

<div class="app-shell">
  <div class="brand-header">
    <img src="assets/logo-white.png" alt="KIYOUNG F&B" />
    <div class="tagline">FRANCHISE VISIT LOG</div>
  </div>

  <div class="content">

    <!-- 1. 로그인 전: 이름/이메일로 접근 요청 -->
    <div id="login-view">
      <p class="page-title">담당자 로그인</p>
      <p class="page-sub">이름과 회사 이메일을 입력하세요.<br/>처음 요청하면 관리자 승인이 필요해요.</p>

      <div class="card">
        <div class="field">
          <label for="sv-name">이름</label>
          <input type="text" id="sv-name" />
        </div>
        <div class="field">
          <label for="sv-email">회사 이메일</label>
          <div class="field-suffix-group">
            <input type="text" id="sv-email-id" placeholder="아이디" />
            <span class="field-suffix">@kiyoung.co.kr</span>
          </div>
        </div>
        <button class="btn btn-primary" onclick="handleRequestAccess()">접속 요청하기</button>
        <p class="hint" id="login-error" style="margin-top:10px; color:var(--danger);"></p>
      </div>
    </div>

    <!-- 2. 승인 대기 화면 -->
    <div id="pending-view" style="display:none;">
      <p class="page-title">승인 대기 중</p>
      <div class="card" style="text-align:center; padding:32px 20px;">
        <div style="font-size:36px; margin-bottom:12px;">⏳</div>
        <div style="font-weight:600; font-size:15px; margin-bottom:6px;" id="pending-email"></div>
        <p class="hint">관리자가 접속을 승인하면 사용할 수 있어요.<br/>승인 후 다시 로그인해주세요.</p>
      </div>
      <button class="btn btn-ghost" onclick="logoutSV()">다른 정보로 다시 시도</button>
    </div>

    <!-- 3. 로그인 후 메인 메뉴 -->
    <div id="main-view" style="display:none;">
      <p class="page-title">안녕하세요, <span id="welcome-name"></span>님</p>
      <p class="page-sub">가맹점의 QR CODE를 스캔하세요.</p>

      <a href="scan.html" style="text-decoration:none; color:inherit;">
        <div class="card" style="text-align:center; padding:32px 20px;">
          <div style="font-size:40px; margin-bottom:8px;">📷</div>
          <div style="font-weight:700; font-size:16px; color:var(--primary); letter-spacing:0.03em;">QR SCAN</div>
        </div>
      </a>

      <div class="btn-row" style="margin-top:8px;">
        <a href="history.html" style="text-decoration:none; color:inherit; flex:1;">
          <button class="btn btn-secondary">방문 이력</button>
        </a>
        <a href="store-lookup.html" style="text-decoration:none; color:inherit; flex:1;">
          <button class="btn btn-secondary">QRCODE 설치</button>
        </a>
      </div>

      <button class="btn btn-ghost" style="margin-top:24px;" onclick="logoutSV()">로그아웃</button>
    </div>

  </div>
</div>

<script src="js/sheets-config.js"></script>
<script src="js/utils.js"></script>
<script>
  function showView(view) {
    document.getElementById("login-view").style.display = view === "login" ? "block" : "none";
    document.getElementById("pending-view").style.display = view === "pending" ? "block" : "none";
    document.getElementById("main-view").style.display = view === "main" ? "block" : "none";
  }

  function renderInitialView() {
    const sv = getCurrentSV();
    if (sv) {
      showView("main");
      document.getElementById("welcome-name").textContent = sv.name;
    } else {
      showView("login");
    }
  }

  async function handleRequestAccess() {
    const name = document.getElementById("sv-name").value.trim();
    const emailId = document.getElementById("sv-email-id").value.trim();
    const errorEl = document.getElementById("login-error");
    errorEl.textContent = "";

    if (!name || !emailId) {
      errorEl.textContent = "이름과 이메일 아이디를 모두 입력해주세요.";
      return;
    }
    if (emailId.includes("@")) {
      errorEl.textContent = "아이디만 입력해주세요 (@kiyoung.co.kr은 자동으로 붙어요).";
      return;
    }

    const email = `${emailId}@kiyoung.co.kr`;

    try {
      const result = await apiPost({ action: "requestAccess", name, email });

      if (result.approved) {
        setCurrentSV({ name: result.name, email: result.email, role: result.role || "staff" });
        renderInitialView();
        return;
      }

      if (result.pending) {
        document.getElementById("pending-email").textContent = email;
        showView("pending");
        return;
      }

      errorEl.textContent = result.error || "요청이 거부되었습니다. 관리자에게 문의해주세요.";
    } catch (e) {
      console.error(e);
      errorEl.textContent = "요청 중 오류가 발생했습니다. 네트워크 또는 설정을 확인해주세요.";
    }
  }

  renderInitialView();

  // 실행 스플래시 화면: 최소 500ms는 보여준 뒤 부드럽게 사라짐
  window.addEventListener("load", () => {
    setTimeout(() => {
      const splash = document.getElementById("app-splash");
      if (splash) {
        splash.classList.add("hide");
        setTimeout(() => splash.remove(), 500);
      }
    }, 500);
  });

  // PWA 서비스워커 등록
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  }
</script>

</body>
</html>
